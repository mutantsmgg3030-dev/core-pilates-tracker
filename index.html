<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Queen Athea's 30-Day Core & Pilates Tracker</title>

  <!-- Chart.js for beautiful, responsive progress visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      transition: background 0.4s ease, color 0.4s ease;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* SOFT MORNING SUNSET THEME */
    body.day {
      background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 100%);
      color: #0f172a;
    }

    /* DEEP PILATES STUDIO EVENING THEME */
    body.night {
      background: linear-gradient(135deg, #181115 0%, #271c24 100%);
      color: #f8fafc;
    }

    .container {
      width: 100%;
      max-width: 650px;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.15);
      backdrop-filter: blur(8px);
      transition: background 0.4s ease, border 0.4s ease, box-shadow 0.4s ease;
    }

    body.day .container {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    body.night .container {
      background: rgba(57, 43, 53, 0.7);
      border: 1px solid rgba(8c, 6d, 82, 0.4);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    body.day h1 { color: #db2777; }
    body.night h1 { color: #f472b6; }

    .subtitle {
      font-size: 13px;
      font-weight: 600;
      opacity: 0.8;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    body.day .subtitle { color: #be185d; }
    body.night .subtitle { color: #f472b6; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 25px;
    }

    .controls-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .select-style, .theme-btn {
      padding: 12px 18px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    body.day .select-style, body.day .theme-btn {
      background: #f1f5f9;
      color: #0f172a;
      border: 1px solid #e2e8f0;
    }

    body.day .select-style:hover, body.day .theme-btn:hover {
      background: #e2e8f0;
    }

    body.night .select-style {
      background: #4d3846;
      color: #f8fafc;
    }
    body.night .select-style:hover {
      background: #5e4556;
    }

    body.night .theme-btn {
      background: #f472b6;
      color: #181115;
      box-shadow: 0 4px 12px rgba(244, 114, 182, 0.2);
    }
    body.night .theme-btn:hover {
      background: #db2777;
      transform: translateY(-1px);
    }

    .session-indicator {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-block;
    }
    
    body.day .session-indicator { 
      background: #ffe4e6;
      color: #9f1239; 
    }
    body.night .session-indicator { 
      background: rgba(244, 114, 182, 0.1);
      color: #f472b6; 
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .input-group input {
      flex: 1;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    body.day .input-group input {
      background: #f8fafc;
      color: #0f172a;
      border: 1px solid #cbd5e1;
    }
    body.day .input-group input:focus {
      border-color: #db2777;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(219, 39, 119, 0.15);
    }

    body.night .input-group input {
      background: #392b35;
      color: white;
      border: 1px solid #5e4556;
    }
    body.night .input-group input:focus {
      border-color: #f472b6;
      background: #392b35;
      box-shadow: 0 0 0 4px rgba(244, 114, 182, 0.15);
    }

    .add-btn {
      padding: 14px 22px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      background: #db2777;
      color: white;
      transition: all 0.2s ease;
    }
    .add-btn:hover {
      background: #be185d;
      transform: translateY(-1px);
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      line-height: 1.5;
      font-size: 15px;
      font-weight: 500;
    }

    @media (min-width: 480px) {
      li {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    body.day li {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.02);
    }
    body.day li:hover {
      border-color: #cbd5e1;
    }

    body.night li {
      background: #392b35;
      border: 1px solid rgba(255,255,255,0.02);
    }
    body.night li:hover {
      background: #453440;
    }

    li.completed {
      opacity: 0.6;
    }
    li.completed .task-text {
      text-decoration: line-through;
    }

    .task-text {
      flex: 1;
    }

    .task-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .score-container {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .score-input {
      width: 90px;
      padding: 6px 8px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      outline: none;
    }

    body.day .score-input {
      background: #f1f5f9;
      color: #0f172a;
      border: 1px solid #cbd5e1;
    }
    body.night .score-input {
      background: #4d3846;
      color: #f8fafc;
      border: 1px solid #5e4556;
    }

    .score-btn {
      border: none;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      background: #64748b;
      color: white;
      transition: background 0.2s;
    }
    .score-btn:hover { background: #475569; }

    .actions {
      display: flex;
      gap: 6px;
    }

    .complete-btn, .delete-btn {
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      font-size: 14px;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .complete-btn { background: #2563eb; }
    .complete-btn:hover { background: #1d4ed8; }

    .delete-btn { background: #ef4444; }
    .delete-btn:hover { background: #dc2626; }

    /* GRAPH STYLES */
    .chart-wrapper {
      margin-top: 30px;
      padding: 20px;
      border-radius: 18px;
      transition: background 0.4s ease;
    }
    body.day .chart-wrapper { background: #ffffff; border: 1px solid #e2e8f0; }
    body.night .chart-wrapper { background: #2a1f27; border: 1px solid rgba(8c, 6d, 82, 0.2); }

    .chart-title {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    body.day .chart-title { color: #be185d; }
    body.night .chart-title { color: #f472b6; }

    /* MOTIVATIONAL QUOTE SECTION */
    .quote-box {
      margin-top: 25px;
      padding: 18px;
      border-radius: 16px;
      text-align: center;
      font-style: italic;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
      transition: all 0.4s ease;
    }

    body.day .quote-box {
      background: #fff5f5;
      border-left: 4px solid #db2777;
      color: #9f1239;
    }

    body.night .quote-box {
      background: #2a1f27;
      border-left: 4px solid #f472b6;
      color: #fbcfe8;
    }

  </style>
</head>

<body class="day">

  <div class="container">

    <div class="top-bar">
      <div>
        <h1>👑 Queen Athea Baldomero</h1>
        <div class="subtitle">30-Day Flow & Sculpt Studio</div>
      </div>
      <button class="theme-btn" onclick="toggleTheme()">🌙 Evening Flow</button>
    </div>

    <div class="controls-bar">
      <select id="daySelect" class="select-style" onchange="switchDay()">
        <!-- JS Populated -->
      </select>
    </div>

    <div class="session-indicator" id="sessionLabel">🌅 Morning Core Activation</div>

    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Add custom movement or stretch...">
      <button class="add-btn" onclick="addTask()">Add</button>
    </div>

    <ul id="taskList"></ul>

    <!-- Dynamic Quote Space -->
    <div class="quote-box" id="quoteDisplay">"Physical fitness is the first requisite of happiness."</div>

    <!-- Progress Analytics Graph -->
    <div class="chart-wrapper">
      <div class="chart-title">📈 30-Day Completion Journey (%)</div>
      <canvas id="progressChart" height="140"></canvas>
    </div>

  </div>

  <script>
    let database = JSON.parse(localStorage.getItem("pilatesCoreTrackerDB_v1"));
    let currentDay = localStorage.getItem("pilatesCurrentDay_v1") || "1";
    let theme = localStorage.getItem("theme") || "day";
    let progressChartInstance = null;

    // Curated quotes for Queen Athea
    const morningQuotes = [
      "Good morning, Queen! Your core is your powerhouse—activate it and conquer the day. ✨",
      "In 10 sessions you'll feel the difference, in 20 you'll see it, and in 30 you'll have a whole new body.",
      "Control your mind, brace your core, own your morning. You've got this, Athea!",
      "Every single roll-up makes you stronger than you were yesterday. Let's grow, Queen!",
      "Pilates is complete coordination of body, mind, and spirit. Start your day balanced."
    ];

    const eveningQuotes = [
      "Time to unwind and align. Let's sculpt that beautiful posture, Queen Athea. 🌌",
      "It's not about how high you can lift; it's about the control and deep burn. Breathe through it.",
      "A healthy spine equals an ageless spirit. Sleep well knowing you showed up for yourself tonight.",
      "Be patient with your progress. Real strength is built alignment by alignment.",
      "You are one workout away from a peaceful mind and a powerful core. Finish strong, Queen!"
    ];

    if (!database) {
      database = {};

      for (let i = 1; i <= 30; i++) {
        database[i] = { day: [], night: [] };

        // Morning Session: Core Wakeup & Posture
        database[i]["day"] = [
          { text: `🧘‍♀️ 5-Min Breathwork & Cat-Cow Mobility Warmup`, score: "", completed: false },
          { text: `✨ 3 Sets x Pilates Hundred (100 pumps total)`, score: "", completed: false },
          { text: `🔥 3 Sets x Bird-Dog Hold (Keep core perfectly flat)`, score: "", completed: false },
          { text: `⚡ 3 Sets x Dead Bug (Slow & deliberate execution)`, score: "", completed: false }
        ];

        // Evening Session: Pilates Control & Deep Sculpt
        database[i]["night"] = [
          { text: `🩰 3 Sets x Pilates Roll-Up (Vertebra by vertebra)`, score: "", completed: false },
          { text: `💪 3 Sets x Forearm Side Plank Lift (Left & Right)`, score: "", completed: false },
          { text: `🍑 4 Sets x Glute Bridge Pulses with core tucked`, score: "", completed: false },
          { text: `🦢 3 Sets x Pilates Swimming (Targeting lower back)`, score: "", completed: false }
        ];
      }
      localStorage.setItem("pilatesCoreTrackerDB_v1", JSON.stringify(database));
      localStorage.setItem("pilatesCurrentDay_v1", currentDay);
    }

    document.body.className = theme;
    setupDayDropdown();
    updateThemeUI();
    renderTasks();
    initChart();

    function setupDayDropdown() {
      const select = document.getElementById("daySelect");
      select.innerHTML = "";
      for (let i = 1; i <= 30; i++) {
        const opt = document.createElement("option");
        opt.value = i;
        opt.innerText = `✨ Day ${i} of 30`;
        if (i == currentDay) opt.selected = true;
        select.appendChild(opt);
      }
    }

    function switchDay() {
      currentDay = document.getElementById("daySelect").value;
      localStorage.setItem("pilatesCurrentDay_v1", currentDay);
      changeQuote();
      renderTasks();
    }

    function addTask() {
      const input = document.getElementById("taskInput");
      const text = input.value.trim();
      if (text === "") return;

      if (!database[currentDay]) database[currentDay] = { day: [], night: [] };

      database[currentDay][theme].push({
        text: text,
        score: "",
        completed: false
      });

      saveData();
      renderTasks();
      updateChart();
      input.value = "";
    }

    function renderTasks() {
      const taskList = document.getElementById("taskList");
      taskList.innerHTML = "";

      const dayTasks = (database[currentDay] && database[currentDay][theme]) ? database[currentDay][theme] : [];

      dayTasks.forEach((task, index) => {
        const li = document.createElement("li");
        if (task.completed) {
          li.classList.add("completed");
        }

        li.innerHTML = `
          <span class="task-text">${task.text}</span>
          
          <div class="task-controls">
            <div class="score-container">
              <input type="text" 
                     class="score-input" 
                     id="score-${index}" 
                     placeholder="Reps / Secs" 
                     value="${task.score || ''}" 
                     onkeypress="handleScoreKey(event, ${index})">
              <button class="score-btn" onclick="saveScore(${index})">💾</button>
            </div>

            <div class="actions">
              <button class="complete-btn" onclick="toggleComplete(${index})">✔</button>
              <button class="delete-btn" onclick="deleteTask(${index})">✖</button>
            </div>
          </div>
        `;
        taskList.appendChild(li);
      });
    }

    function saveScore(index) {
      const scoreVal = document.getElementById(`score-${index}`).value.trim();
      database[currentDay][theme][index].score = scoreVal;
      
      if (scoreVal !== "") {
        database[currentDay][theme][index].completed = true;
      }
      
      saveData();
      renderTasks();
      updateChart();
    }

    function handleScoreKey(event, index) {
      if (event.key === "Enter") {
        saveScore(index);
      }
    }

    function toggleComplete(index) {
      database[currentDay][theme][index].completed = !database[currentDay][theme][index].completed;
      saveData();
      renderTasks();
      updateChart();
    }

    function deleteTask(index) {
      database[currentDay][theme].splice(index, 1);
      saveData();
      renderTasks();
      updateChart();
    }

    function saveData() {
      localStorage.setItem("pilatesCoreTrackerDB_v1", JSON.stringify(database));
    }

    function toggleTheme() {
      theme = (theme === "day") ? "night" : "day";
      document.body.className = theme;
      localStorage.setItem("theme", theme);
      
      updateThemeUI();
      changeQuote();
      renderTasks();
      updateChart();
    }

    function changeQuote() {
      const qDisplay = document.getElementById("quoteDisplay");
      const list = (theme === "day") ? morningQuotes : eveningQuotes;
      const randomQuote = list[Math.floor(Math.random() * list.length)];
      qDisplay.innerText = `"${randomQuote}"`;
    }

    function updateThemeUI() {
      const btn = document.querySelector(".theme-btn");
      const label = document.getElementById("sessionLabel");

      if (theme === "day") {
        btn.innerHTML = "🌙 Evening Flow";
        label.innerHTML = "🌅 Morning Core Activation";
        document.getElementById("taskInput").placeholder = "Add morning movements...";
      } else {
        btn.innerHTML = "☀️ Morning Activation";
        label.innerHTML = "🌌 Evening Pilates Control";
        document.getElementById("taskInput").placeholder = "Add evening movements...";
      }
    }

    /* PROGRESS GRAPH LOGIC */
    function getCompletionData() {
      const percentages = [];
      for (let i = 1; i <= 30; i++) {
        const dayData = database[i];
        if (!dayData) {
          percentages.push(0);
          continue;
        }
        // Evaluate combined completion percentage of both morning and evening routines
        const totalTasks = dayData.day.length + dayData.night.length;
        if (totalTasks === 0) {
          percentages.push(0);
          continue;
        }
        const completedTasks = dayData.day.filter(t => t.completed).length + dayData.night.filter(t => t.completed).length;
        percentages.push(Math.round((completedTasks / totalTasks) * 100));
      }
      return percentages;
    }

    function initChart() {
      const ctx = document.getElementById('progressChart').getContext('2d');
      const labels = Array.from({length: 30}, (_, i) => `D${i+1}`);
      
      const primaryColor = (theme === 'day') ? '#db2777' : '#f472b6';
      const gridColor = (theme === 'day') ? '#f1f5f9' : '#392b35';
      const textColor = (theme === 'day') ? '#64748b' : '#94a3b8';

      progressChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Completion Status',
            data: getCompletionData(),
            borderColor: primaryColor,
            backgroundColor: 'rgba(244, 114, 182, 0.1)',
            borderWidth: 3,
            tension: 0.3,
            pointRadius: 2,
            pointHoverRadius: 5,
            fill: true
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: {
              grid: { color: gridColor },
              ticks: { color: textColor, font: { size: 10 } }
            },
            y: {
              min: 0,
              max: 100,
              grid: { color: gridColor },
              ticks: {
                color: textColor,
                callback: function(value) { return value + "%" },
                font: { size: 10 }
              }
            }
          }
        }
      });
    }

    function updateChart() {
      if (!progressChartInstance) return;
      const primaryColor = (theme === 'day') ? '#db2777' : '#f472b6';
      const gridColor = (theme === 'day') ? '#f1f5f9' : '#392b35';
      const textColor = (theme === 'day') ? '#64748b' : '#94a3b8';

      progressChartInstance.data.datasets[0].data = getCompletionData();
      progressChartInstance.data.datasets[0].borderColor = primaryColor;
      progressChartInstance.options.scales.x.grid.color = gridColor;
      progressChartInstance.options.scales.x.ticks.color = textColor;
      progressChartInstance.options.scales.y.grid.color = gridColor;
      progressChartInstance.options.scales.y.ticks.color = textColor;
      
      progressChartInstance.update();
    }
  </script>

</body>
</html>
